<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#090b10"><title>iPhone 計算機</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap');:root{--ink:#ffd84a;--muted:#9298a4;--orange:#ff9f0a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b10;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}body:before{content:'';position:fixed;width:38rem;height:38rem;left:50%;top:40%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,159,10,.07),transparent 64%);pointer-events:none}.stage{min-height:100vh;padding:7vh 8vw 4vh;display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,390px) minmax(120px,.55fr);align-items:center;gap:clamp(2rem,8vw,9rem)}.intro{max-width:27rem}.eyebrow,.footer{font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}.eyebrow{font-size:.68rem;color:var(--orange);margin:0 0 1.8rem}h1{font-size:clamp(3rem,5vw,5.2rem);line-height:.98;letter-spacing:-.075em;margin:0;font-weight:500}h1 em{color:var(--orange);font-style:normal}.copy{color:var(--muted);line-height:1.75;font-size:.95rem;margin:1.7rem 0 2.2rem}.meta{font: .65rem 'DM Mono',monospace;color:#5e6572;text-transform:uppercase;letter-spacing:.1em}.dot{width:6px;height:6px;display:inline-block;background:#8fca66;border-radius:50%;margin-right:.55rem;box-shadow:0 0 12px #8fca66}.phone{justify-self:center;width:min(84vw,360px);transform:scale(.9);transform-origin:center}.shell{padding:10px;border-radius:52px;background:linear-gradient(135deg,#4b4f58,#15171d 16%,#050608 80%);box-shadow:0 42px 90px #0008,inset 0 0 0 1px #fff2;position:relative}.island{position:absolute;z-index:5;top:19px;left:50%;transform:translateX(-50%);width:100px;height:28px;border-radius:20px;background:#000}.screen{overflow:hidden;border-radius:43px;position:relative;aspect-ratio:.49/1;min-height:620px;background:#000}.status{height:60px;display:flex;align-items:center;justify-content:space-between;padding:12px 26px 0;font-size:.78rem;font-weight:600}.icons{display:flex;align-items:center;gap:8px}.signal{display:flex;align-items:flex-end;gap:2px;height:12px}.signal i{width:2px;background:var(--ink);border-radius:2px;display:block}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i</style><link rel="manifest" href="manifest.webmanifest"></head><body><main class="stage"><section class="intro"><p class="eyebrow">ENCORE / UTILITY 01</p><h1>簡潔，<em>剛剛好。</em></h1><p class="copy">一台不需要學習成本的單機計算機，<br>為每天的小計算保留一點安靜。</p><div class="meta"><span class="dot"></span>Offline · Ready to use</div></section><section class="phone"><div class="shell"><div class="island"></div><div class="screen"><header class="status"><span>9:41</span><span class="icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi">◔</span><span class="battery"><b></b></span></span></header><div class="calc"><div class="display-wrap"><div class="expr" id="expr"></div><div class="display" id="display">0</div></div><div class="keys" id="keys"><button class="key fn" data-a="clear">AC</button><button class="key fn" data-a="sign">±</button><button class="key fn" data-a="percent">%</button><button class="key op" data-v="÷">÷</button><button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key op" data-v="×">×</button><button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key op" data-v="−">−</button><button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key op" data-v="+">+</button><button class="key zero" data-v="0">0</button><button class="key" data-a="decimal">.</button><button class="key op" data-a="equals">=</button></div></div><div class="home"></div></div></div></section><footer class="footer">Designed for the little things.</footer></main><script>let cur='0',stored=null,op=null,wait=false,done=false;const d=document.getElementById('display'),e=document.getElementById('expr');const fmt=v=>Number.isFinite(+v)?(+v).toLocaleString('en-US',{maximumFractionDigits:12}):'Error';function render(){d.textContent=fmt(cur);e.textContent=op&&stored!==null?fmt(stored)+' '+op:'';d.style.fontSize=d.textContent.replace(/[,-]/g,'').length>9?'2.55rem':''}function clearAll(){cur='0';stored=null;op=null;wait=false;done=false;render()}function digit(x){if(cur==='Error'||wait||done){cur=x;wait=false;done=false}else cur=cur==='0'?x:cur+x;render()}function dec(){if(cur==='Error'||wait||done){cur='0.';wait=false;done=false}else if(!cur.includes('.'))cur+='.';render()}function calc(a,b,o){a=+a;b=+b;return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b}function choose(o){if(op&&stored!==null&&!wait){const r=calc(stored,cur,op);cur=String(r);stored=Number.isFinite(r)?r:null}else stored=+cur;op=o;wait=true;done=false;render()}function eq(){if(!op||stored===null)return;const old=fmt(stored)+' '+op+' '+fmt(cur)+' =';cur=String(calc(stored,cur,op));stored=null;op=null;wait=true;done=true;render();e.textContent=old}function act(a){if(a==='clear')clearAll();if(a==='sign'&&cur!=='0'&&cur!=='Error'){cur=cur[0]==='-'?cur.slice(1):'-'+cur;render()}if(a==='percent'&&cur!=='Error'){cur=String(+cur/100);render()}if(a==='decimal')dec();if(a==='equals')eq()}document.getElementById('keys').onclick=x=>{const b=x.target.closest('button');if(!b)return;b.dataset.v?(Number.isInteger(+b.dataset.v)?digit(b.dataset.v):choose(b.dataset.v)):act(b.dataset.a)};document.onkeydown=x=>{if(Number.isInteger(+x.key))digit(x.key);else if(x.key=='.')dec();else if(x.key==='Enter'||x.key==='=')eq();else if(x.key==='Escape')clearAll();else if(x.key==='%')act('percent');else if({'+':'+','-':'−','*':'×','/':'÷'}[x.key])choose({'+':'+','-':'−','*':'×','/':'÷'}[x.key])};render();</script><script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }</script></body></html>
